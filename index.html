<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Hub</title>
<style>
  :root{
    --cream:#FDF6EC;
    --cream-deep:#F7EDDD;
    --text:#3B342C;
    --text-soft:#7A7266;
    --pink:#F4D9E0;      /* General */
    --pink-deep:#EBC1CD;
    --sage:#DCEAD6;      /* Science */
    --sage-deep:#C4DEBB;
    --blue:#D8E6F2;      /* Tech */
    --blue-deep:#BFDAEE;
    --lavender:#E5DFF2;  /* Cyber */
    --lavender-deep:#D2C7EA;
    --peach:#F6E3CE;     /* Other */
    --peach-deep:#F0D0AE;
    --radius:999px;
    --shadow:0 4px 14px rgba(59,52,44,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--cream);
    color:var(--text);
  }
  a{color:inherit; text-decoration:none;}

  /* ---------- HEADER ---------- */
  header{
    position:sticky; top:0; z-index:100;
    background:var(--cream);
    border-bottom:1px solid var(--cream-deep);
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 32px;
  }
  .logo{font-weight:700; font-size:1.2rem; letter-spacing:0.5px;}
  nav{display:flex; gap:6px;}
  .nav-item{position:relative;}
  .nav-btn{
    padding:9px 18px; border-radius:var(--radius);
    font-size:0.95rem; cursor:pointer; border:none; background:transparent;
    font-family:inherit; color:var(--text);
    transition:background .15s ease;
  }
  .nav-item:hover .nav-btn{background:var(--cream-deep);}
  .dropdown{
    display:none; position:absolute; top:100%; left:0; margin-top:6px;
    background:#fff; border-radius:18px; box-shadow:var(--shadow);
    min-width:230px; padding:8px 0; overflow:hidden;
  }
  .nav-item::after{
    content:''; position:absolute; top:100%; left:0; right:0; height:10px;
  }
  .nav-item:hover .dropdown{display:block;}
  .dropdown a{
    display:block; padding:10px 20px; font-size:0.9rem; color:var(--text);
  }
  .dropdown a:hover{background:var(--cream);}
  .divider{height:1px; background:rgba(59,52,44,0.08); margin:4px 12px;}

  .search-wrap{display:flex; align-items:center; gap:8px;}
  .search-icon{
    width:38px; height:38px; border-radius:50%; border:none;
    background:var(--peach); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:1rem; box-shadow:var(--shadow);
    transition:transform .15s ease;
  }
  .search-icon:hover{transform:scale(1.06);}
  .search-input{
    width:0; opacity:0; padding:0; border:none; border-radius:var(--radius);
    background:var(--cream-deep); font-family:inherit; font-size:0.9rem;
    transition:width .2s ease, opacity .2s ease, padding .2s ease;
  }
  .search-input.open{width:200px; opacity:1; padding:9px 16px;}
  .search-box{position:relative;}
  .hero-search-box{max-width:320px; margin:0 auto;}
  .search-results{
    display:none; position:absolute; top:110%; left:0; right:0; z-index:150;
    background:#fff; border-radius:16px; box-shadow:var(--shadow); overflow:hidden;
    max-height:280px; overflow-y:auto;
  }
  .search-results.open{display:block;}
  .search-result-item{
    display:block; padding:11px 16px; font-size:0.85rem; cursor:pointer; text-align:left;
  }
  .search-result-item:hover{background:var(--cream);}
  .search-result-item small{display:block; color:var(--text-soft); font-size:0.72rem; margin-top:2px;}
  .search-empty{padding:14px 16px; font-size:0.82rem; color:var(--text-soft); text-align:left;}

  /* ---------- HOMEPAGE ---------- */
  .hero{text-align:center; padding:70px 20px 40px;}
  .hero h1{font-size:2.4rem; margin:0 0 10px;}
  .hero p{color:var(--text-soft); margin:0 0 26px; font-size:1.05rem;}
  .hero .search-input{width:320px; opacity:1; padding:12px 22px; margin:0 auto; display:block; background:#fff; box-shadow:var(--shadow);}

  .cards{
    display:grid; grid-template-columns:repeat(5,1fr); gap:18px;
    max-width:1100px; margin:40px auto; padding:0 24px;
  }
  .card{
    border-radius:24px; padding:26px 18px; text-align:center; cursor:pointer;
    box-shadow:var(--shadow); transition:transform .15s ease;
  }
  .card:hover{transform:translateY(-4px);}
  .card .emoji{font-size:1.8rem; display:block; margin-bottom:8px;}
  .card.general{background:var(--pink);}
  .card.science{background:var(--sage);}
  .card.tech{background:var(--blue);}
  .card.cyber{background:var(--lavender);}
  .card.other{background:var(--peach);}

  .strip{max-width:1100px; margin:40px auto; padding:0 24px;}
  .strip h3{font-size:1rem; color:var(--text-soft); margin-bottom:14px;}
  .strip-row{display:flex; gap:14px; overflow-x:auto; padding-bottom:6px;}
  .strip-item{
    flex:0 0 auto; background:#fff; border-radius:18px; padding:14px 20px;
    box-shadow:var(--shadow); font-size:0.9rem; white-space:nowrap;
    cursor:pointer; transition:transform .15s ease;
  }
  .strip-item:hover{transform:translateY(-2px);}

  footer{
    text-align:center; padding:40px 20px; color:var(--text-soft); font-size:0.85rem;
    border-top:1px solid var(--cream-deep); margin-top:60px;
  }

  /* ---------- FLOATING DAILY FACT ---------- */
  #fact-widget{position:fixed; bottom:26px; right:26px; z-index:200;}
  #fact-circle{
    width:58px; height:58px; border-radius:50%; background:var(--pink-deep);
    box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center;
    font-size:1.4rem; cursor:pointer; position:relative; border:none;
    transition:transform .15s ease;
  }
  #fact-circle:hover{transform:scale(1.07);}
  #streak-badge{
    position:absolute; top:-6px; right:-6px; background:var(--text);
    color:var(--cream); font-size:0.7rem; font-weight:700; border-radius:50%;
    width:22px; height:22px; display:flex; align-items:center; justify-content:center;
  }
  #fact-card{
    display:none; position:absolute; bottom:70px; right:0; width:270px;
    background:#fff; border-radius:20px; box-shadow:var(--shadow); padding:20px;
  }
  #fact-card.open{display:block;}
  .fact-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  #fact-card h4{margin:0; font-size:0.85rem; color:var(--text-soft);}
  #shuffle-fact{
    width:24px; height:24px; border-radius:50%; border:none;
    background:var(--peach); font-family:inherit; font-size:0.95rem; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow); transition:transform .15s ease;
  }
  #shuffle-fact:hover{transform:scale(1.12) rotate(90deg);}
  #fact-card p{margin:0 0 14px; font-size:0.92rem; line-height:1.4;}
  #mark-read{
    background:var(--sage-deep); border:none; border-radius:var(--radius);
    padding:8px 18px; font-family:inherit; font-size:0.85rem; cursor:pointer;
    box-shadow:var(--shadow); transition:transform .15s ease;
  }
  #mark-read:hover{transform:scale(1.05);}
  #mark-read.done{background:var(--sage); opacity:0.6; cursor:default;}

  /* ---------- TOPIC PAGE ---------- */
  #topic-page{display:none; max-width:1100px; margin:0 auto; padding:30px 24px 80px;}
  .breadcrumb{font-size:0.85rem; color:var(--text-soft); margin-bottom:20px;}
  .breadcrumb a{color:var(--text-soft); text-decoration:underline;}
  .topic-layout{display:flex; gap:36px; align-items:flex-start;}
  .sidebar{
    flex:0 0 240px; position:sticky; top:90px;
    background:#fff; border-radius:20px; padding:18px; box-shadow:var(--shadow);
  }
  .sidebar h5{margin:0 0 12px; font-size:0.85rem; color:var(--text-soft);}
  .sidebar-item{
    display:flex; align-items:flex-start; gap:10px; padding:9px 8px;
    border-radius:14px; cursor:pointer; font-size:0.88rem; margin-bottom:2px;
  }
  .sidebar-item:hover{background:var(--cream);}
  .sidebar-item.active{background:var(--cream-deep); font-weight:600;}
  .checkbox{
    width:18px; height:18px; border-radius:6px; border:2px solid var(--sage-deep);
    flex:0 0 18px; margin-top:1px; display:flex; align-items:center; justify-content:center;
    font-size:0.7rem; cursor:pointer;
  }
  .checkbox.checked{background:var(--sage-deep);}

  .content-col{flex:1; min-width:0;}
  .concept{
    background:#fff; border-radius:22px; padding:26px; margin-bottom:22px;
    box-shadow:var(--shadow); scroll-margin-top:100px;
  }
  .concept h3{margin:0 0 14px;}
  .resource{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 16px; border-radius:16px; margin-bottom:10px; background:var(--cream);
  }
  .resource:last-child{margin-bottom:0;}
  .resource .r-info{flex:1;}
  .resource .r-title{font-weight:600; font-size:0.92rem;}
  .resource .r-desc{font-size:0.82rem; color:var(--text-soft); margin-top:2px;}
  .tag{
    font-size:0.7rem; padding:4px 12px; border-radius:var(--radius);
    background:var(--peach-deep); margin-left:12px; white-space:nowrap;
  }
  .login-badge{
    font-size:0.68rem; padding:4px 10px; border-radius:var(--radius);
    margin-left:10px; white-space:nowrap;
  }
  .login-no{background:var(--sage);}
  .login-yes{background:var(--peach);}
  .practice-card{
    background:linear-gradient(135deg, var(--sage) 0%, var(--blue) 100%);
  }
  .practice-desc{font-size:0.88rem; color:var(--text); margin:0 0 14px;}
  .sidebar-item.practice-nav{font-weight:600;}
  .placeholder{
    background:#fff; border-radius:22px; padding:40px; text-align:center;
    box-shadow:var(--shadow); color:var(--text-soft);
  }

  @media(max-width:800px){
    .cards{grid-template-columns:repeat(2,1fr);}
    nav{display:none;}
    .topic-layout{flex-direction:column;}
    .sidebar{position:relative; top:0; width:100%; flex:none;}
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="#/">🌱 Learning Hub</a>
  <nav id="main-nav"></nav>
  <div class="search-wrap">
    <button class="search-icon" onclick="toggleSearch()">🔍</button>
    <div class="search-box">
      <input class="search-input" id="search-input" placeholder="Search sources...">
      <div class="search-results" id="search-results"></div>
    </div>
  </div>
</header>

<div id="home-page">
  <section class="hero">
    <h1>My Learning Hub</h1>
    <p>The best sources, curated by topic, for everything I want to learn.</p>
    <div class="search-box hero-search-box">
      <input class="search-input open" id="hero-search-input" placeholder="Search topics or resources...">
      <div class="search-results" id="hero-search-results"></div>
    </div>  </section>

  <div class="cards" id="home-cards"></div>

  <div class="strip">
    <h3>Recently updated</h3>
    <div class="strip-row" id="recent-strip"></div>
  </div>

  <footer>
    Built by me, for me — always growing. · Last updated August 2026
  </footer>
</div>

<div id="topic-page">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div class="topic-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="content-col" id="content-col"></div>
  </div>
</div>

<div id="fact-widget">
  <div id="fact-card">
    <div class="fact-header">
      <h4>Today's fact</h4>
      <button id="shuffle-fact" onclick="shuffleFact()" title="Show another fact">+</button>
    </div>
    <p id="fact-text"></p>
    <button id="mark-read" onclick="markRead()">✓ Mark as read</button>
  </div>
  <button id="fact-circle" onclick="toggleFact()">
    💡
    <span id="streak-badge">0</span>
  </button>
</div>

<script>
/* ---------------- DATA (loaded from data.json) ---------------- */
let TOPICS = null;   // built from data.json categories
let CONTENT = {};    // built from data.json concepts
let PRACTICE = {};   // built from data.json practice
let FACTS = [];       // flattened from data.json facts

const nav = document.getElementById('main-nav');
const cards = document.getElementById('home-cards');
const recent = document.getElementById('recent-strip');
const SEARCH_INDEX = [];

async function loadData(){
  const res = await fetch('data.json');
  const data = await res.json();

  TOPICS = {};
  Object.entries(data.categories).forEach(([catKey, cat])=>{
    TOPICS[catKey] = { label: cat.label, emoji: cat.emoji, color: catKey, subtopics: [] };
    Object.entries(cat.subtopics).forEach(([slug, sub])=>{
      TOPICS[catKey].subtopics.push({ slug, label: sub.label });
      if(sub.concepts) CONTENT[`${catKey}/${slug}`] = sub.concepts;
      if(sub.practice) PRACTICE[`${catKey}/${slug}`] = sub.practice;
    });
  });
  Object.values(data.facts).forEach(list => FACTS.push(...list));

  buildNav();
  buildHomeCards();
  buildRecentStrip();
  SEARCH_INDEX.push(...buildSearchIndex());
  initDailyFact();
  render();
}

/* ---------------- BUILD NAV / HOME ---------------- */
function buildNav(){
  Object.entries(TOPICS).forEach(([key, t]) => {
    const item = document.createElement('div');
    item.className = 'nav-item';
    item.innerHTML = `
      <button class="nav-btn">${t.emoji} ${t.label}</button>
      <div class="dropdown">
        ${t.subtopics.map((s,i) => `${i>0?'<div class="divider"></div>':''}<a href="#/${key}/${s.slug}">${s.label}</a>`).join('')}
      </div>`;
    nav.appendChild(item);
  });
}

function buildHomeCards(){
  Object.entries(TOPICS).forEach(([key, t]) => {
    const card = document.createElement('div');
    card.className = `card ${t.color}`;
    card.onclick = () => location.hash = `#/${key}/${t.subtopics[0].slug}`;
    card.innerHTML = `<span class="emoji">${t.emoji}</span>${t.label}`;
    cards.appendChild(card);
  });
}

function buildRecentStrip(){
  const picks = [
    {label:"Cybersecurity: Free Foundations", hash:"cyber/cybersecurity"},
    {label:"Detection Engineering: Practice", hash:"cyber/detection"},
    {label:"Python: Free Foundations", hash:"tech/python"},
    {label:"Docker: Practice", hash:"tech/docker"},
    {label:"Torah History: Primary Texts", hash:"general/torah-history"},
  ];
  picks.forEach(item=>{
    const d = document.createElement('a');
    d.className = 'strip-item';
    d.href = `#/${item.hash}`;
    d.textContent = item.label;
    recent.appendChild(d);
  });
}

/* ---------------- SEARCH TOGGLE ---------------- */
function toggleSearch(){
  document.getElementById('search-input').classList.toggle('open');
  document.getElementById('search-input').focus();
}

/* ---------------- SEARCH ---------------- */
function buildSearchIndex(){
  const idx = [];
  Object.entries(TOPICS).forEach(([catKey, cat])=>{
    cat.subtopics.forEach(sub=>{
      idx.push({
        label: sub.label, sub: `${cat.emoji} ${cat.label}`, hash: `${catKey}/${sub.slug}`,
        text: `${sub.label} ${cat.label}`.toLowerCase()
      });
      const concepts = CONTENT[`${catKey}/${sub.slug}`];
      if(concepts){
        concepts.forEach(c=>{
          c.resources.forEach(r=>{
            idx.push({
              label: r.title, sub: `${sub.label} — ${c.title}`, hash: `${catKey}/${sub.slug}`,
              text: `${r.title} ${r.desc} ${sub.label} ${cat.label} ${c.title}`.toLowerCase()
            });
          });
        });
      }
    });
  });
  return idx;
}

function wireSearch(inputId, resultsId){
  const input = document.getElementById(inputId);
  const results = document.getElementById(resultsId);
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ results.classList.remove('open'); results.innerHTML=''; return; }
    const matches = SEARCH_INDEX.filter(item => item.text.includes(q)).slice(0, 8);
    results.innerHTML = matches.length
      ? matches.map(m => `<a class="search-result-item" href="#/${m.hash}">${m.label}<small>${m.sub}</small></a>`).join('')
      : `<div class="search-empty">No matches yet — try another word.</div>`;
    results.classList.add('open');
  });
  input.addEventListener('blur', ()=> setTimeout(()=>results.classList.remove('open'), 150));
  input.addEventListener('focus', ()=>{ if(input.value.trim()) results.classList.add('open'); });
}
wireSearch('search-input', 'search-results');
wireSearch('hero-search-input', 'hero-search-results');

/* ---------------- DAILY FACT WIDGET ---------------- */
let streak = 0, readToday = false;
function initDailyFact(){
  try{
    streak = parseInt(localStorage.getItem('hub-streak')) || 0;
    readToday = localStorage.getItem('hub-read-date') === new Date().toDateString();
  }catch(e){}
  document.getElementById('streak-badge').textContent = streak;
  document.getElementById('fact-text').textContent = FACTS[new Date().getDate() % FACTS.length];
  if(readToday){ const b=document.getElementById('mark-read'); b.textContent='✓ Read today'; b.classList.add('done'); }
}

function toggleFact(){ document.getElementById('fact-card').classList.toggle('open'); }
function shuffleFact(){
  const el = document.getElementById('fact-text');
  let next;
  do{ next = FACTS[Math.floor(Math.random()*FACTS.length)]; } while(next === el.textContent && FACTS.length > 1);
  el.textContent = next;
}
function markRead(){
  if(readToday) return;
  streak += 1; readToday = true;
  document.getElementById('streak-badge').textContent = streak;
  const b = document.getElementById('mark-read');
  b.textContent = '✓ Read today'; b.classList.add('done');
  try{
    localStorage.setItem('hub-streak', streak);
    localStorage.setItem('hub-read-date', new Date().toDateString());
  }catch(e){}
  setTimeout(()=>document.getElementById('fact-card').classList.remove('open'), 900);
}

/* ---------------- ROUTING ---------------- */
function loginBadge(login){
  return login
    ? `<span class="login-badge login-yes">🔐 Login required</span>`
    : `<span class="login-badge login-no">🔓 No login</span>`;
}

function render(){
  if(!TOPICS) return;
  const hash = location.hash.replace('#/','');
  const home = document.getElementById('home-page');
  const page = document.getElementById('topic-page');
  if(!hash){ home.style.display='block'; page.style.display='none'; return; }
  home.style.display='none'; page.style.display='block';

  const [catKey, subSlug] = hash.split('/');
  const cat = TOPICS[catKey];
  if(!cat) return;
  const sub = cat.subtopics.find(s=>s.slug===subSlug) || cat.subtopics[0];

  document.getElementById('breadcrumb').innerHTML =
    `<a href="#/">Home</a> &nbsp;›&nbsp; ${cat.emoji} ${cat.label} &nbsp;›&nbsp; ${sub.label}`;

  const sidebar = document.getElementById('sidebar');
  const contentCol = document.getElementById('content-col');
  const key = `${catKey}/${sub.slug}`;
  const concepts = CONTENT[key];
  const practice = PRACTICE[key];

  if(!concepts){
    sidebar.innerHTML = `<h5>${sub.label}</h5><div class="sidebar-item">Being researched...</div>`;
    contentCol.innerHTML = `<div class="placeholder">📚 This topic hasn't been researched and built yet.<br>Ask to have "${sub.label}" populated next.</div>`;
    return;
  }

  const allSections = practice ? [...concepts, {title:"Practice", isPractice:true}] : concepts;

  sidebar.innerHTML = `<h5>${sub.label}</h5>` + allSections.map((c,i)=>`
    <div class="sidebar-item${c.isPractice?' practice-nav':''}" data-target="concept-${i}">
      <span class="checkbox" onclick="toggleCheck(event,this)"></span>
      <span>${i+1}. ${c.isPractice?'🎯 Practice':c.title}</span>
    </div>`).join('');

  contentCol.innerHTML = allSections.map((c,i)=>{
    if(c.isPractice){
      return `
      <div class="concept practice-card" id="concept-${i}">
        <h3>${i+1}. 🎯 Practice: ${practice.title}</h3>
        <p class="practice-desc">${practice.desc}</p>
        <a class="resource" href="${practice.url}" target="_blank" rel="noopener">
          <div class="r-info"><div class="r-title">Start practicing →</div></div>
          ${loginBadge(practice.login)}
        </a>
      </div>`;
    }
    return `
    <div class="concept" id="concept-${i}">
      <h3>${i+1}. ${c.title}</h3>
      ${c.resources.map(r=>`
        <a class="resource" href="${r.url}" target="_blank" rel="noopener">
          <div class="r-info">
            <div class="r-title">${r.title}</div>
            <div class="r-desc">${r.desc}</div>
          </div>
          <span class="tag">${r.tag}</span>
          ${loginBadge(r.login)}
        </a>`).join('')}
    </div>`;
  }).join('');

  // scroll-highlight
  const items = sidebar.querySelectorAll('.sidebar-item');
  const targets = contentCol.querySelectorAll('.concept');
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        items.forEach(it=>it.classList.remove('active'));
        const idx = [...targets].indexOf(en.target);
        if(items[idx]) items[idx].classList.add('active');
      }
    });
  }, {rootMargin:'-30% 0px -60% 0px'});
  targets.forEach(t=>obs.observe(t));

  items.forEach(it=>{
    it.addEventListener('click', (e)=>{
      if(e.target.classList.contains('checkbox')) return;
      document.getElementById(it.dataset.target).scrollIntoView({behavior:'smooth'});
    });
  });
}

function toggleCheck(e, el){
  e.stopPropagation();
  el.classList.toggle('checked');
  el.textContent = el.classList.contains('checked') ? '✓' : '';
}

window.addEventListener('hashchange', render);
loadData();
</script>

</body>
</html>
